name: Publish scheduled blog posts

on:
  schedule:
    # Weekdays 11:45 and 16:15 Europe/Rome.
    # UTC times for both summer (CEST, UTC+2) and winter (CET, UTC+1);
    # the script only publishes items whose publish_at has passed.
    - cron: '45 9,10 * * 1-5'
    - cron: '15 14,15 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-scheduled-posts
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Publish due posts
        run: python .github/scripts/publish_scheduled.py

      - name: Commit and push
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes"
            exit 0
          fi
          git config user.name "Keks128"
          git config user.email "210616417+Keks128@users.noreply.github.com"
          git add -A blog .github/scheduled-posts
          git commit -m "blog: publish scheduled posts"
          git push
