<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Privacy Policy · RMA — webreputation.agency</title>
  <meta name="robots" content="index,follow" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    .doc { position: relative; z-index: 2; max-width: 860px; margin-inline: auto; padding: clamp(28px,5vw,64px) var(--pad) clamp(60px,8vw,110px); }
    .doc-top { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-top: 28px; flex-wrap: wrap; }
    .doc-back { display: inline-flex; align-items: center; gap: 9px; font-size: 14px; color: var(--ink-2); transition: color .2s; }
    .doc-back:hover { color: var(--accent-2); }
    .doc-back svg { transform: rotate(180deg); }
    .doc-lang { display: flex; gap: 3px; border: 1px solid var(--hair-2); padding: 3px; background: var(--glass); backdrop-filter: blur(10px); }
    .doc-lang button { font-family: var(--font-mono); font-size: 11.5px; font-weight: 600; letter-spacing: 0.08em; padding: 6px 12px; color: var(--ink-3); transition: color .2s, background .2s; }
    .doc-lang button.active { background: var(--accent); color: #04130c; }
    .doc-head { margin-top: clamp(32px,5vw,56px); }
    .doc-head .eyebrow { margin-bottom: 18px; }
    .doc h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(2rem,4.5vw,3rem); line-height: 1.04; letter-spacing: -0.02em; margin-bottom: 14px; }
    .doc-meta { font-family: var(--font-mono); font-size: 12.5px; color: var(--ink-3); letter-spacing: 0.03em; }
    .doc-card { margin-top: clamp(28px,4vw,44px); border: 1px solid var(--hair); background: var(--glass); backdrop-filter: blur(16px); padding: clamp(24px,4vw,44px); }
    .doc section { padding-block: 22px; border-bottom: 1px solid var(--hair); }
    .doc section:first-of-type { padding-top: 4px; }
    .doc section:last-of-type { border-bottom: none; padding-bottom: 4px; }
    .doc h2 { font-family: var(--font-display); font-weight: 600; font-size: clamp(1.15rem,2vw,1.4rem); letter-spacing: -0.01em; margin-bottom: 12px; display: flex; align-items: baseline; gap: 12px; }
    .doc h2 .idx { font-family: var(--font-mono); font-size: 12px; color: var(--accent-2); font-weight: 500; }
    .doc p { font-size: 15px; line-height: 1.72; color: var(--ink-2); text-wrap: pretty; margin-bottom: 10px; }
    .doc p:last-child { margin-bottom: 0; }
    .doc strong { color: var(--ink); font-weight: 600; }
    .doc a.inl { color: var(--accent-2); text-decoration: underline; text-underline-offset: 2px; }
    .doc .kv { display: grid; grid-template-columns: minmax(160px,auto) 1fr; gap: 6px 22px; margin-top: 6px; }
    .doc .kv dt { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.04em; color: var(--ink-3); text-transform: uppercase; padding-top: 3px; }
    .doc .kv dd { font-size: 15px; color: var(--ink); line-height: 1.6; }
    @media (max-width: 560px){ .doc .kv { grid-template-columns: 1fr; gap: 2px; } .doc .kv dd { margin-bottom: 12px; } }
  </style>
</head>
<body>
  <div class="doc">
    <div class="doc-top">
      <a class="doc-back" href="index.html"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg><span data-i="back">Back to site</span></a>
      <div class="doc-lang" role="group" aria-label="Language">
        <button data-lang="en">EN</button>
        <button data-lang="it">IT</button>
      </div>
    </div>

    <div class="doc-head">

      <div class="doc-meta"><span data-i="effective">Effective date: 22 May 2026</span> · RMA — Web Reputation Agency</div>
    </div>

    <div class="doc-card" id="doc-body"></div>
  </div>

        title: "Privacy Policy",
        effective: "Effective date: 22 May 2026",
        controllerH: "Data controller",

          { h: "Data controller", kv: [
            ["Entity", "RMA — Web Reputation Agency (by Attolini Agency)"],
            ["State reg. no.", "319784700118738"],

          ], p: ["RMA — Web Reputation Agency is the data controller for the personal data processed through this site."] },
          { h: "Data we collect", p: ["We collect your personal data when you contact us via email at <a class='inl' href='mailto:mail@attoliniagency.com'>mail@attoliniagency.com</a> or through Telegram at <a class='inl' href='https://t.me/Webreputationagency' target='_blank' rel='noopener'>@Webreputationagency</a>, when you fill out contact forms on our website, or when you request our reputation management services.", "The data we collect includes your first name, last name, email address, phone number, company name, and any other information you choose to provide voluntarily. We also collect technical data such as your IP address, browser type, operating system, and pages visited on our site through the use of cookies and similar tracking technologies, which we use to enhance your browsing experience and analyze site traffic."] },
          { h: "How we use your data", p: ["We use your personal data exclusively to respond to your consultation requests, to provide you with the reputation management and restructuring services you have requested, to send you communications regarding our services, to improve our website and offerings, and to comply with legal and regulatory obligations."] },
          { h: "Legal basis", p: ["The processing of your data is based on your explicit consent, on the performance of a contract to which you are a party, or on compliance with a legal obligation to which we are subject."] },
          { h: "Sharing your data", p: ["We do not sell, trade, or rent your personal data to third parties, but we may share your data with trusted service providers who assist us in managing the website and delivering services, always under confidentiality agreements and in compliance with data protection regulations."] },
          { h: "Security", p: ["We implement appropriate technical and organizational security measures to protect your data from unauthorized access, alteration, disclosure, or destruction, although no data transmission over the internet can be guaranteed as completely secure."] },
          { h: "Your rights", p: ["As a user, you have the right to access your personal data held by us, to request its rectification, erasure, restriction of processing, or to object to the processing itself, as well as to request data portability to another controller.", "To exercise these rights or for any privacy-related questions, you can contact us via email at <a class='inl' href='mailto:mail@attoliniagency.com'>mail@attoliniagency.com</a> or through Telegram at <a class='inl' href='https://t.me/Webreputationagency' target='_blank' rel='noopener'>@Webreputationagency</a>."] },
          { h: "Cookies", p: ["Our website uses essential cookies for the functioning of the site, analytical cookies to understand how users interact with the site, and functional cookies to remember your preferences. You can manage cookie settings directly from your browser, but please note that disabling certain cookies may limit the functionality of the site."] },
          { h: "International transfers", p: ["Your data may be transferred to and stored on servers located in countries other than your country of residence, including Russia and the United Kingdom, and we are committed to ensuring that such transfers occur in compliance with applicable data protection laws, including the European GDPR and Russian Federal Law No. 152-FZ."] },
          { h: "Data retention", p: ["We retain your personal data only for as long as necessary to fulfill the purposes for which it was collected or to comply with legal obligations, after which it will be deleted or anonymized."] },
          { h: "Updates & contact", p: ["This Privacy Policy may be updated periodically, and we invite you to consult this page for any changes. Effective date: 22 May 2026.", "For any clarification, please contact us at <a class='inl' href='mailto:mail@attoliniagency.com'>mail@attoliniagency.com</a>."] },
        ],
      },
      it: {
        back: "Torna al sito",
        eyebrow: "Note legali",
        title: "Privacy Policy",
        effective: "Data di entrata in vigore: 22 maggio 2026",
        controllerH: "Titolare del trattamento",
        sections: [
          { h: "Premessa", p: ["La presente Privacy Policy descrive le modalità di trattamento dei dati personali degli utenti che visitano il sito <strong>webreputation.agency</strong> e che utilizzano i servizi offerti da RMA — Web Reputation Agency, progetto di Attolini Agency."] },
          { h: "Titolare del trattamento", kv: [
            ["Soggetto", "RMA — Web Reputation Agency (by Attolini Agency)"],
            ["N. Reg. Statale", "319784700118738"],
            ["Codice Fiscale", "781315656060"],
            ["Indirizzo", "45 Berkeley Square, Mayfair, London W1J 5EB, United Kingdom"],
            ["Email", "<a class='inl' href='mailto:mail@attoliniagency.com'>mail@attoliniagency.com</a>"],
            ["Telegram", "<a class='inl' href='https://t.me/Webreputationagency' target='_blank' rel='noopener'>@Webreputationagency</a>"],
          ], p: ["RMA — Web Reputation Agency è il titolare del trattamento dei dati personali trattati attraverso questo sito."] },
          { h: "Dati che raccogliamo", p: ["Raccogliamo i tuoi dati personali quando ci contatti via email all'indirizzo <a class='inl' href='mailto:mail@attoliniagency.com'>mail@attoliniagency.com</a> o tramite Telegram all'utenza <a class='inl' href='https://t.me/Webreputationagency' target='_blank' rel='noopener'>@Webreputationagency</a>, quando compili i moduli di contatto sul sito o quando richiedi i nostri servizi di reputation management.", "I dati che raccogliamo includono il tuo nome, cognome, indirizzo email, numero di telefono, il nome della tua azienda e ogni altra informazione che scegli di fornirci volontariamente. Raccogliamo inoltre dati tecnici come il tuo indirizzo IP, il tipo di browser, il sistema operativo e le pagine visitate sul nostro sito attraverso l'uso di cookie e tecnologie di tracciamento simili, che utilizziamo per migliorare la tua esperienza di navigazione e per analizzare il traffico del sito."] },
          { h: "Come utilizziamo i dati", p: ["Utilizziamo i tuoi dati personali esclusivamente per rispondere alle tue richieste di consulenza, per fornirti i servizi richiesti di gestione e ristrutturazione della reputazione online, per inviarti comunicazioni relative ai nostri servizi, per migliorare il nostro sito e le nostre offerte e per adempiere a obblighi legali e normativi."] },
          { h: "Base giuridica", p: ["Il trattamento dei tuoi dati si basa sul tuo consenso esplicito, sull'esecuzione di un contratto di cui sei parte o sull'adempimento di un obbligo legale al quale siamo soggetti."] },
          { h: "Condivisione dei dati", p: ["Non vendiamo, scambiamo o affittiamo i tuoi dati personali a terzi, ma potremmo condividere i tuoi dati con fornitori di servizi di fiducia che ci assistono nella gestione del sito e nell'erogazione dei servizi, sempre con accordi di riservatezza e conformità alla normativa sulla protezione dei dati."] },
          { h: "Sicurezza", p: ["Adottiamo misure di sicurezza tecniche e organizzative adeguate per proteggere i tuoi dati da accessi non autorizzati, alterazione, divulgazione o distruzione, sebbene nessuna trasmissione di dati su Internet possa essere garantita come completamente sicura."] },
          { h: "I tuoi diritti", p: ["In qualità di utente, hai il diritto di accedere ai tuoi dati personali in nostro possesso, di richiederne la rettifica, la cancellazione, la limitazione del trattamento o di opporti al trattamento stesso, nonché di richiedere la portabilità dei dati verso un altro titolare.", "Per esercitare questi diritti o per qualsiasi domanda relativa alla privacy, puoi contattarci via email all'indirizzo <a class='inl' href='mailto:mail@attoliniagency.com'>mail@attoliniagency.com</a> o tramite Telegram all'utenza <a class='inl' href='https://t.me/Webreputationagency' target='_blank' rel='noopener'>@Webreputationagency</a>."] },
          { h: "Cookie", p: ["Il nostro sito utilizza cookie essenziali per il funzionamento del sito, cookie analitici per comprendere come gli utenti interagiscono con il sito e cookie funzionali per ricordare le tue preferenze. Puoi gestire le impostazioni dei cookie direttamente dal tuo browser, ma ti informiamo che la disattivazione di alcuni cookie potrebbe limitare la funzionalità del sito."] },
          { h: "Trasferimenti internazionali", p: ["I tuoi dati potrebbero essere trasferiti e conservati su server situati in paesi diversi dal tuo paese di residenza, inclusi Russia e Regno Unito, e ci impegniamo a garantire che tali trasferimenti avvengano in conformità con le leggi applicabili sulla protezione dei dati, inclusi il GDPR europeo e la legge russa 152-FZ."] },
          { h: "Conservazione dei dati", p: ["Conserviamo i tuoi dati personali solo per il tempo necessario a soddisfare le finalità per le quali sono stati raccolti o per adempiere a obblighi legali, dopo di che verranno cancellati o resi anonimi."] },
          { h: "Aggiornamenti e contatti", p: ["La presente Privacy Policy può essere aggiornata periodicamente e ti invitiamo a consultare questa pagina per eventuali modifiche. Data di entrata in vigore: 22 maggio 2026.", "Per qualsiasi chiarimento, contattaci all'indirizzo <a class='inl' href='mailto:mail@attoliniagency.com'>mail@attoliniagency.com</a>."] },
        ],
      },
    };

    function render(lang) {
      var c = CONTENT[lang] || CONTENT.en;
      document.documentElement.lang = lang;
      document.querySelectorAll("[data-i]").forEach(function (el) {
        var k = el.getAttribute("data-i");
        if (c[k]) el.innerHTML = c[k];
      });
      var body = document.getElementById("doc-body");
      body.innerHTML = "";
      c.sections.forEach(function (s, i) {
        var sec = document.createElement("section");
        var idx = String(i + 1).padStart(2, "0");
        var html = '<h2><span class="idx">' + idx + '</span><span>' + s.h + '</span></h2>';
        if (s.kv) {
          html += '<dl class="kv">';
          s.kv.forEach(function (row) { html += "<dt>" + row[0] + "</dt><dd>" + row[1] + "</dd>"; });
          html += "</dl>";
        }
        (s.p || []).forEach(function (para) { html += "<p>" + para + "</p>"; });
        sec.innerHTML = html;
        body.appendChild(sec);
      });
      document.querySelectorAll(".doc-lang button").forEach(function (b) {
        b.classList.toggle("active", b.getAttribute("data-lang") === lang);
      });
    }

    (function () {
      var saved = null;
      try { saved = localStorage.getItem("wra_lang"); } catch (e) {}
      var lang = (saved === "it" || saved === "en") ? saved : "en";
      render(lang);
      document.querySelectorAll(".doc-lang button").forEach(function (b) {
        b.addEventListener("click", function () {
          var l = b.getAttribute("data-lang");
          try { localStorage.setItem("wra_lang", l); } catch (e) {}
          render(l);
        });
      });
    })();
  </script>
</body>
</html>
